<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecipeBox AI — recipe organizer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>RecipeBox AI</h1>
  <p>Your recipes, organized. Search, plan the week, and let the grocery list write itself. Free, private, in your browser.</p>
</header>
<nav class="tabs">
  <button data-tab="recipes" class="active">Recipes</button>
  <button data-tab="add">Add Recipe</button>
  <button data-tab="week">Week Plan</button>
  <button data-tab="grocery">Grocery List</button>
</nav>
<main>
  <section id="tab-recipes" class="tabpage"></section>
  <section id="tab-add" class="tabpage" style="display:none"></section>
  <section id="tab-week" class="tabpage" style="display:none"></section>
  <section id="tab-grocery" class="tabpage" style="display:none"></section>
</main>
<footer>RecipeBox AI · 100% local — your recipes never leave this browser. Comes with 20 starter recipes to get you going.</footer>
<script src="js/recipes.js"></script>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
